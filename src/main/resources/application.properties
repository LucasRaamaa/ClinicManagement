spring.application.name=clinic-management

# CONFIGURACIÓN DE BASE DE DATOS

spring.datasource.url=jdbc:mysql://localhost:3306/clinic_management?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE HIBERNATE / JPA

# "validate" asegura que nuestras clases en Java coincidan con el script SQL que ya corrimos.
spring.jpa.hibernate.ddl-auto=validate
# Esto imprimirá en consola las consultas SQL que Spring hace por detrás (muy útil para debug).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Configuración de Spring Boot Mail (SMTP Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_CORREO@gmail.com
spring.mail.password=TU_CONTRASEÑA_DE_APLICACION
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true